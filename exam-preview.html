<title>اختبار الحاسوب — معاينة تجريبية</title>
<style>
  :root {
    --ground: #f5f7f5;
    --surface: #ffffff;
    --surface-2: #eef2ef;
    --ink: #1c2a27;
    --ink-2: #55665f;
    --line: #d9e1dc;
    --accent: #0e7c66;
    --accent-ink: #ffffff;
    --accent-soft: #e2f1ec;
    --good: #1e8a5a;
    --good-soft: #e3f3ea;
    --bad: #c0392b;
    --bad-soft: #fbe9e6;
    --warn: #a86a12;
    --warn-soft: #f8efdc;
    --shadow: 0 1px 3px rgba(28, 42, 39, .08), 0 4px 16px rgba(28, 42, 39, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101715;
      --surface: #182220;
      --surface-2: #1f2c29;
      --ink: #e6eeea;
      --ink-2: #93a69e;
      --line: #2b3a35;
      --accent: #43bfa2;
      --accent-ink: #0c1613;
      --accent-soft: #1b332d;
      --good: #4cc98a;
      --good-soft: #16311f;
      --bad: #e77465;
      --bad-soft: #3a1d18;
      --warn: #d9a04a;
      --warn-soft: #372a12;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #101715; --surface: #182220; --surface-2: #1f2c29;
    --ink: #e6eeea; --ink-2: #93a69e; --line: #2b3a35;
    --accent: #43bfa2; --accent-ink: #0c1613; --accent-soft: #1b332d;
    --good: #4cc98a; --good-soft: #16311f;
    --bad: #e77465; --bad-soft: #3a1d18;
    --warn: #d9a04a; --warn-soft: #372a12;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --ground: #f5f7f5; --surface: #ffffff; --surface-2: #eef2ef;
    --ink: #1c2a27; --ink-2: #55665f; --line: #d9e1dc;
    --accent: #0e7c66; --accent-ink: #ffffff; --accent-soft: #e2f1ec;
    --good: #1e8a5a; --good-soft: #e3f3ea;
    --bad: #c0392b; --bad-soft: #fbe9e6;
    --warn: #a86a12; --warn-soft: #f8efdc;
    --shadow: 0 1px 3px rgba(28, 42, 39, .08), 0 4px 16px rgba(28, 42, 39, .06);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", "Noto Sans Arabic", Arial, sans-serif;
    direction: rtl;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- Sticky exam bar ---------- */
  .exambar {
    position: sticky; top: 0; z-index: 40;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .exambar-inner {
    max-width: 780px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: 0; }
  .brand small { display: block; font-weight: 400; color: var(--ink-2); font-size: 11.5px; }
  .timer {
    margin-inline-start: auto;
    font-variant-numeric: tabular-nums;
    font-size: 22px; font-weight: 700;
    padding: 2px 14px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
    direction: ltr;
  }
  .timer.low { background: var(--bad-soft); color: var(--bad); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .55; } }
  .answered-chip { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .answered-chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .progress-track {
    width: 100%; height: 4px; background: var(--surface-2);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width .3s ease; }

  /* ---------- Intro ---------- */
  .intro-card {
    margin-top: 40px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 36px 32px; box-shadow: var(--shadow);
  }
  .intro-card h1 { margin: 0 0 6px; font-size: 26px; text-wrap: balance; }
  .intro-card .sub { color: var(--ink-2); margin: 0 0 26px; font-size: 15px; }
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 30px; }
  .rule {
    background: var(--surface-2); border-radius: 10px; padding: 14px 16px;
  }
  .rule .num { font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .rule .lbl { font-size: 12.5px; color: var(--ink-2); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 16px; font-weight: 700;
    padding: 13px 34px; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink);
    transition: filter .15s ease, transform .1s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .btn[disabled] { background: var(--surface-2); color: var(--ink-2); cursor: not-allowed; filter: none; }
  .btn-ghost {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent);
  }

  /* ---------- Question cards ---------- */
  .qcard {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px 24px; margin-top: 18px;
    box-shadow: var(--shadow);
  }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .qnum {
    flex: none; font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 7px; padding: 2px 10px;
    font-variant-numeric: tabular-nums;
  }
  .qpts { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .qtext { font-size: 16.5px; font-weight: 600; margin: 0 0 14px; text-wrap: balance; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; background: transparent;
    font-family: inherit; font-size: 15px; text-align: start; color: var(--ink);
    transition: border-color .12s ease, background .12s ease;
    width: 100%;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt .dot {
    flex: none; width: 18px; height: 18px; margin-top: 4px;
    border: 2px solid var(--line); border-radius: 50%;
    transition: border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.sel .dot { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3.5px var(--surface); }
  .opt-letter { flex: none; font-weight: 700; color: var(--ink-2); font-size: 14px; margin-top: 1px; }
  .opt.sel .opt-letter { color: var(--accent); }

  /* ---------- Finish area ---------- */
  .finish-area { margin-top: 30px; text-align: center; }
  .finish-hint { color: var(--ink-2); font-size: 14px; margin-bottom: 12px; }
  .finish-hint b { color: var(--warn); font-variant-numeric: tabular-nums; }
  .jump-link {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0;
  }

  /* ---------- Results ---------- */
  .score-card {
    margin-top: 40px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 36px 32px; text-align: center; box-shadow: var(--shadow);
  }
  .score-big {
    font-size: 64px; font-weight: 800; line-height: 1.1;
    font-variant-numeric: tabular-nums; color: var(--accent);
  }
  .score-big small { font-size: 24px; font-weight: 600; color: var(--ink-2); }
  .score-label { color: var(--ink-2); font-size: 14px; margin-bottom: 20px; }
  .verdict { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .stats-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 22px 0 28px; }
  .stat {
    background: var(--surface-2); border-radius: 10px; padding: 12px 20px; min-width: 108px;
  }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .v.good { color: var(--good); } .stat .v.bad { color: var(--bad); } .stat .v.warn { color: var(--warn); }
  .stat .k { font-size: 12px; color: var(--ink-2); }

  .review-title { margin: 44px 0 4px; font-size: 20px; }
  .review-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 8px; }
  .rcard {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 24px; margin-top: 16px;
    border-inline-start: 4px solid var(--bad);
  }
  .rcard.skipped { border-inline-start-color: var(--warn); }
  .rline { display: flex; align-items: flex-start; gap: 8px; border-radius: 9px; padding: 9px 14px; font-size: 14.5px; margin-top: 8px; }
  .rline .tag { flex: none; font-size: 12px; font-weight: 700; margin-top: 2px; }
  .rline.wrong { background: var(--bad-soft); color: var(--ink); }
  .rline.wrong .tag { color: var(--bad); }
  .rline.right { background: var(--good-soft); }
  .rline.right .tag { color: var(--good); }
  .all-correct {
    margin-top: 24px; background: var(--good-soft); border-radius: 12px;
    padding: 26px; text-align: center; font-weight: 700; color: var(--good); font-size: 17px;
  }

  footer.note { margin-top: 56px; text-align: center; color: var(--ink-2); font-size: 12.5px; }
</style>

<div class="exambar" id="exambar" hidden>
  <div class="exambar-inner">
    <div class="brand">اختبار الحاسوب<small>معاينة تجريبية</small></div>
    <div class="answered-chip">أجبت <b id="answeredCount">0</b> / <b>60</b></div>
    <div class="timer" id="timer">60:00</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
const BANK = [{"id": "q001", "question": "أي من أنواع الحاسبات التالية يُستخدم لمعالجة البيانات المتقطعة (المنفصلة)؟", "options": ["الحاسبات الهجينة", "الحاسبات الرقمية", "الحاسبات الكمومية", "الحاسبات التناظرية"], "correctIndex": 1}, {"id": "q002", "question": "جهاز حاسوب في مستشفى يراقب درجة حرارة المريض وضغط دمه كإشارات مستمرة ثم يحوّلها إلى قيم رقمية للتحليل والعرض. ما نوع هذا الحاسوب؟", "options": ["حاسوب فائق", "حاسوب هجين", "حاسوب رقمي فقط", "حاسوب تناظري فقط"], "correctIndex": 1}, {"id": "q003", "question": "ما نوع الحاسوب الأنسب لمعالجة البيانات المستمرة مثل قياسات درجات الحرارة؟", "options": ["الحاسبات التناظرية", "الحاسبات المركزية", "الحاسبات الشخصية", "الحاسبات الرقمية"], "correctIndex": 0}, {"id": "q004", "question": "أي من أنواع الحاسبات التالية يُستخدم في التطبيقات العلمية والهندسية التي تتطلب دقة ومعالجة فائقة؟", "options": ["الحاسبات المركزية", "الحاسبات المحمولة", "الحاسبات الشخصية", "الحاسبات الفائقة (Super Computers)"], "correctIndex": 3}, {"id": "q005", "question": "الحاسبات المركزية (Mainframe) تُستخدم بشكل أساسي في:", "options": ["التطبيقات التجارية والإدارية الكبيرة", "تحرير الصور والفيديو المنزلي", "التحكم بالأجهزة الطبية المنزلية", "الألعاب والتطبيقات الترفيهية"], "correctIndex": 0}, {"id": "q006", "question": "ما وظيفة وحدة المعالجة المركزية (CPU) في الحاسوب؟", "options": ["معالجة البيانات وتنفيذ التعليمات", "توفير الطاقة للمكونات", "عرض الرسوميات على الشاشة", "تخزين البيانات بشكل دائم"], "correctIndex": 0}, {"id": "q007", "question": "ما وظيفة ذاكرة الوصول العشوائي (RAM)؟", "options": ["معالجة الرسوميات والفيديو", "تخزين البيانات مؤقتاً لتوفير وصول سريع أثناء التشغيل", "تخزين البيانات بشكل دائم حتى بعد إطفاء الجهاز", "الاحتفاظ بنظام الإقلاع الأساسي"], "correctIndex": 1}, {"id": "q008", "question": "أي وصف يميّز ذاكرة القراءة فقط (ROM) عن ذاكرة الوصول العشوائي (RAM)؟", "options": ["ROM ذاكرة مؤقتة تُمسح عند انقطاع الكهرباء بينما RAM دائمة", "ROM ذاكرة دائمة لا تفقد محتواها بانقطاع الكهرباء بينما RAM مؤقتة", "كلاهما ذاكرة مؤقتة لكن ROM أسر function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

  return a;
}

    const refill = usedOrder.map(id => byId[id]).filter(Boolean);
    picked = shuffle(fresh).concat(refill.slice(0, EXAM_SIZE - fresh.length));
    used = new Set(); // دورة جديدة
  }
  const newUsed = [...used, ...picked.map(q => q.id)];
  setUsedIds(newUsed);
  return picked;
}

/* ---------- توزيع 100 درجة عشوائياً (أعداد صحيحة، مجموعها 100 بالضبط) ---------- */
function assignPoints(qs) {
  const pts = new Array(qs.length).fill(1);
  let remaining = TOTAL_POINTS - qs.length; // 40
  while (remaining > 0) {
    pts[Math.floor(Math.random() * qs.length)] += 1;
    remaining--;
  }
  return qs.map((q, i) => ({ ...q, points: pts[i] }));
}

/* ---------- views ---------- */
function showIntro() {
  exambar.hidden = true;
  app.innerHTML = `
    <div class="intro-card">
      <h1>اختبار مادة الحاسوب — معاينة تجريبية</h1>
      <p class="sub">محاكاة كاملة لاختبار إلكتروني من بنك يضم ${BANK.length} سؤالاً، وفي كل محاولة تظهر أسئلة مختلفة عن السابقة.</p>
      <div class="rules">
        <div class="rule"><div class="num">60</div><div class="lbl">سؤالاً عشوائياً في كل محاولة</div></div>
        <div class="rule"><div class="num">60</div><div class="lbl">دقيقة مدة الاختبار</div></div>
        <div class="rule"><div class="num">100</div><div class="lbl">درجة تتوزع عشوائياً على الأسئلة</div></div>
        <div class="rule"><div class="num">${BANK.length}</div><div class="lbl">سؤالاً في البنك الكامل</div></div>
      </div>
      <button class="btn" id="startBtn">ابدأ الاختبار</button>
    </div>
    <footer class="note">تظهر درجة كل سؤال بجانب رقمه. زر إنهاء الاختبار يُفعَّل بعد الإجابة على جميع الأسئلة، وينتهي الاختبار تلقائياً عند نفاد الوقت.</footer>
  `;
  document.getElementById("startBtn").addEventListener("click", startExam);
}

function startExam() {
  exam = assignPoints(pickQuestions());
  answers = {};
  timeLeft = EXAM_MINUTES * 60;
  renderExam();
  exambar.hidden = false;
  updateBar();
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  window.scrollTo({ top: 0 });
}

const AR_LETTERS = ["أ", "ب", "ج", "د"];

function renderExam() {
  const cards = exam.map((q, qi) => {
    const opts = q.options.map((opt, oi) => `
      <button type="button" class="opt" data-q="${qi}" data-o="${oi}">
        <span class="dot" aria-hidden="true"></span>
        <span class="opt-letter">${AR_LETTERS[oi]}.</span>
        <span>${escapeHtml(opt)}</span>
      </button>`).join("");
    return `
      <div class="qcard" id="qc${qi}">
        <div class="qhead">
          <span class="qnum">س${qi + 1}</span>
          <span class="qpts">${q.points} ${q.points === 1 ? "درجة" : q.points === 2 ? "درجتان" : "درجات"}</span>
        </div>
        <p class="qtext">${escapeHtml(q.question)}</p>
        <div class="opts" role="radiogroup" aria-label="خيارات السؤال ${qi + 1}">${opts}</div>
      </div>`;
  }).join("");

  app.innerHTML = cards + `
    <div class="finish-area">
      <div class="finish-hint" id="finishHint"></div>
      <button class="btn" id="finishBtn" disabled>إنهاء الاختبار</button>
    </div>`;

  app.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      answers[exam[qi].id] = oi;
      const card = document.getElementById("qc" + qi);
      card.querySelectorAll(".opt").forEach(b => b.classList.toggle("sel", +b.dataset.o === oi));
      updateBar();
    });
  });
  document.getElementById("finishBtn").addEventListener("click", () => finishExam(false));
  updateFinishArea();
}

function updateBar() {
  const n = Object.keys(answers).length;
  answeredCountEl.textContent = n;
  progressFill.style.width = (n / EXAM_SIZE * 100) + "%";
  updateFinishArea();
}

function updateFinishArea() {
  const hint = document.getElementById("finishHint");
  const btn = document.getElementById("finishBtn");
  if (!hint || !btn) return;
  const remaining = EXAM_SIZE - Object.keys(answers).length;
  if (remaining > 0) {
    btn.disabled = true;
    hint.innerHTML = `بقي <b>${remaining}</b> ${remaining === 1 ? "سؤال" : remaining === 2 ? "سؤالان" : remaining <= 10 ? "أسئلة" : "سؤالاً"} دون إجابة — <button type="button" class="jump-link" id="jumpBtn">انتقل لأول سؤال غير مُجاب</button>`;
    const jb = document.getElementById("jumpBtn");
    if (jb) jb.addEventListener("click", jumpToUnanswered);
  } else {
    btn.disabled = false;
    hint.textContent = "أجبت على جميع الأسئلة. يمكنك مراجعة إجاباتك ثم إنهاء الاختبار.";
  }
}

function jumpToUnanswered() {
  for (let i = 0; i < exam.length; i++) {
    if (!(exam[i].id in answers)) {
      document.getElementById("qc" + i).scrollIntoView({ block: "center" });
      return;
    }
  }
}

function tick() {
  timeLeft--;
  const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
  timerEl.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  timerEl.classList.toggle("low", timeLeft <= 300);
  if (timeLeft <= 0) {
    clearInterval(timerId);
    finishExam(true);
  }
}

function finishExam(timedOut) {
  clearInterval(timerId);
  exambar.hidden = true;

  let earned = 0, correct = 0, wrong = 0, skipped = 0;
  const misses = [];
  exam.forEach((q, qi) => {
    const a = answers[q.id];
    if (a === undefined) {
      skipped++;
      misses.push({ q, qi, chosen: null });
    } else if (a === q.correctIndex) {
      correct++;
      earned += q.points;
    } else {
      wrong++;
      misses.push({ q, qi, chosen: a });
    }
  });

  const pct = Math.round(earned);
  let verdict, vcolor;
  if (pct >= 90) { verdict = "ممتاز — أداء متميز"; vcolor = "var(--good)"; }
  else if (pct >= 75) { verdict = "جيد جداً — قريب من التميز"; vcolor = "var(--good)"; }
  else if (pct >= 60) { verdict = "جيد — تحتاج مراجعة بعض المواضيع"; vcolor = "var(--warn)"; }
  else if (pct >= 50) { verdict = "مقبول — راجع الإجابات أدناه بتركيز"; vcolor = "var(--warn)"; }
  else { verdict = "تحتاج مزيداً من المراجعة — لا تيأس"; vcolor = "var(--bad)"; }

  const reviewCards = misses.map(({ q, qi, chosen }) => `
    <div class="rcard ${chosen === null ? "skipped" : ""}">
      <div class="qhead">
        <span class="qnum">س${qi + 1}</span>
        <span class="qpts">${q.points} ${q.points === 1 ? "درجة" : q.points === 2 ? "درجتان" : "درجات"} — ${chosen === null ? "لم تُجب عليه" : "إجابة خاطئة"}</span>
      </div>
      <p class="qtext">${escapeHtml(q.question)}</p>
      ${chosen === null
        ? ""
        : `<div class="rline wrong"><span class="tag">إجابتك:</span><span>${AR_LETTERS[chosen]}. ${escapeHtml(q.options[chosen])}</span></div>`}
      <div class="rline right"><span class="tag">الصحيح:</span><span>${AR_LETTERS[q.correctIndex]}. ${escapeHtml(q.options[q.correctIndex])}</span></div>
    </div>`).join("");

  app.innerHTML = `
    <div class="score-card">
      ${timedOut ? `<div class="verdict" style="color:var(--warn)">انتهى الوقت — تم احتساب الأسئلة المُجابة فقط</div>` : ""}
      <div class="score-label">نتيجتك النهائية</div>
      <div class="score-big">${earned}<small> / 100</small></div>
      <div class="verdict" style="color:${vcolor}">${verdict}</div>
      <div class="stats-row">
        <div class="stat"><div class="v good">${correct}</div><div class="k">إجابة صحيحة</div></div>
        <div class="stat"><div class="v bad">${wrong}</div><div class="k">إجابة خاطئة</div></div>
        ${skipped ? `<div class="stat"><div class="v warn">${skipped}</div><div class="k">بلا إجابة</div></div>` : ""}
        <div class="stat"><div class="v">${Math.round(correct / EXAM_SIZE * 100)}%</div><div class="k">نسبة الإجابات الصحيحة</div></div>
      </div>
      <button class="btn" id="retryBtn">إعادة الاختبار بأسئلة جديدة</button>
    </div>
    ${misses.length
      ? `<h2 class="review-title">مراجعة الأخطاء (${misses.length})</h2>
         <p class="review-sub">لكل سؤال أخطأت فيه أو تركته: إجابتك، والإجابة الصحيحة للمراجعة.</p>
         ${reviewCards}`
      : `<div class="all-correct">إجاباتك كلها صحيحة — علامة كاملة! 🎉</div>`}
    <footer class="note">عند إعادة الاختبار تُختار 60 سؤالاً مختلفة عن محاولاتك السابقة حتى يكتمل البنك (${BANK.length} سؤالاً) ثم تبدأ دورة جديدة.</footer>
  `;
  document.getElementById("retryBtn").addEventListener("click", startExam);
  window.scrollTo({ top: 0 });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

showIntro();
</script>
